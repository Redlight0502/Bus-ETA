<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KMB Transit & Config</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            background-color: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000000;
            }
        }
        .mono {
            font-family: 'JetBrains Mono', -apple-system, monospace;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        /* Modal transition */
        .modal-enter {
            opacity: 0;
            transform: translateY(100%);
        }
        .modal-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-exit {
            opacity: 1;
            transform: translateY(0);
        }
        .modal-exit-active {
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen text-black dark:text-white pb-20 selection:bg-gray-200 dark:selection:zinc-800">

    <header class="sticky top-0 z-40 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-gray-100 dark:border-zinc-900">
        <div class="max-w-md mx-auto px-5 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <h1 class="text-[15px] font-semibold tracking-tight">Transit</h1>
                <span id="sync-timer" class="mono text-xs text-gray-400 dark:text-zinc-500 font-medium bg-gray-100 dark:bg-zinc-900 px-2 py-0.5 rounded-full">30s</span>
            </div>
            <button onclick="openConfigModal()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-zinc-900 flex items-center justify-center text-gray-600 dark:text-zinc-400 hover:text-black dark:hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <main id="app" class="max-w-md mx-auto px-5 pt-6 flex flex-col gap-8">
        <div class="flex flex-col items-center justify-center py-32 gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-gray-200 dark:border-zinc-800 border-t-black dark:border-t-white animate-spin"></div>
        </div>
    </main>

    <div id="config-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-end sm:items-center justify-center">
        <div class="w-full max-w-md bg-white dark:bg-zinc-950 rounded-t-3xl sm:rounded-2xl p-6 flex flex-col max-h-[85vh] overflow-y-auto border border-gray-100 dark:border-zinc-800 shadow-2xl">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-gray-100 dark:border-zinc-900">
                <h2 class="text-base font-bold tracking-tight">監控站點設定 (Config)</h2>
                <button onclick="closeConfigModal()" class="text-sm font-semibold text-gray-400 hover:text-black dark:hover:text-white">完成</button>
            </div>

            <div class="bg-gray-50 dark:bg-zinc-900/60 p-4 rounded-2xl border border-gray-200/60 dark:border-zinc-800 flex flex-col gap-3 mb-6">
                <div class="text-xs font-semibold text-gray-500 dark:text-zinc-400 uppercase tracking-wider">新增監控路線</div>
                <div class="grid grid-cols-2 gap-2">
                    <input id="input-stopid" type="text" placeholder="Stop ID (例: 6E6EBC...)" class="w-full bg-white dark:bg-zinc-900 px-3 py-2 rounded-xl text-xs border border-gray-200 dark:border-zinc-800 focus:outline-none focus:border-black dark:focus:border-white mono">
                    <input id="input-stopname" type="text" placeholder="站點名稱 (例: 日景樓)" class="w-full bg-white dark:bg-zinc-900 px-3 py-2 rounded-xl text-xs border border-gray-200 dark:border-zinc-800 focus:outline-none focus:border-black dark:focus:border-white">
                </div>
                <div class="flex gap-2">
                    <input id="input-route" type="text" placeholder="路線 (例: 46X)" class="w-2/3 bg-white dark:bg-zinc-900 px-3 py-2 rounded-xl text-xs border border-gray-200 dark:border-zinc-800 focus:outline-none focus:border-black dark:focus:border-white mono uppercase">
                    <button onclick="addCustomConfig()" class="w-1/3 bg-black dark:bg-white text-white dark:text-black font-semibold text-xs py-2 rounded-xl transition-opacity active:opacity-80">加入</button>
                </div>
            </div>

            <div class="text-xs font-semibold text-gray-500 dark:text-zinc-400 uppercase tracking-wider mb-2">現有監控清單</div>
            <div id="config-list-container" class="flex flex-col gap-2">
                </div>
            
            <div class="mt-6 pt-4 border-t border-gray-100 dark:border-zinc-900 flex justify-between items-center text-xs text-gray-400">
                <span>提示：可自由增刪站點與路線</span>
                <button onclick="resetDefaultConfig()" class="text-red-500 hover:underline">重設預設值</button>
            </div>
        </div>
    </div>

    <script>
        // 預設監控清單
        const DEFAULT_CONFIG = [
            { id: '1', stopId: '6E6EBC9D1AF2DA52', stopName: '日景樓', route: '46X' },
            { id: '2', stopId: '81B719F7DC3F0FAD', stopName: '城門隧道轉車站', route: '46X' },
            { id: '3', stopId: '9E8E99C5BB698AC2', stopName: '城門隧道轉車站', route: '48X' },
            { id: '4', stopId: '9E8E99C5BB698AC2', stopName: '城門隧道轉車站', route: '269D' },
            { id: '5', stopId: 'C8276DF869656712', stopName: '城門隧道轉車站', route: '40X' }
        ];

        // 從 LocalStorage 載入設定，若無則使用預設
        function loadConfig() {
            const saved = localStorage.getItem('kmb_transit_config');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    return DEFAULT_CONFIG;
                }
            }
            return DEFAULT_CONFIG;
        }

        let userConfig = loadConfig();
        let monitorDataCache = null;

        async function fetchBusETA(stopId, route) {
            try {
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const data = await response.json();
                return data.data.filter(item => item.route === route);
            } catch (error) {
                console.error(`讀取站點 ${stopId} 路線 ${route} 失敗:`, error);
                return [];
            }
        }

        async function refreshDataFromAPI() {
            // 根據 userConfig 內的 stopId 抓取所有資料
            // 同一個 stopId 可以被多個 route 共用快取避免重複請求
            const stopIds = [...new Set(userConfig.map(c => c.stopId))];
            const stopDataMap = {};

            for (const stopId of stopIds) {
                try {
                    const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                    const data = await response.json();
                    stopDataMap[stopId] = data.data || [];
                } catch (err) {
                    console.error(`讀取站點 ${stopId} 失敗:`, err);
                    stopDataMap[stopId] = [];
                }
            }

            // 組裝結構給渲染器使用
            // 按照 stopName 分組
            const groupMap = {};
            userConfig.forEach(item => {
                if (!groupMap[item.stopName]) {
                    groupMap[item.stopName] = [];
                }
                const rawList = stopDataMap[item.stopId] || [];
                const busData = rawList.filter(b => b.route === item.route);
                groupMap[item.stopName].push({
                    route: item.route,
                    busData: busData
                });
            });

            const newData = Object.keys(groupMap).map(stopName => ({
                stopName: stopName,
                routesData: groupMap[stopName]
            }));

            monitorDataCache = newData;
        }

        function renderInterface() {
            const appContainer = document.getElementById('app');
            if (!monitorDataCache) return;

            let htmlTemplate = '';

            monitorDataCache.forEach(group => {
                if (group.routesData && group.routesData.length > 0) {
                    htmlTemplate += `
                        <div class="flex flex-col gap-2">
                            <div class="text-[11px] font-medium text-gray-400 dark:text-zinc-500 uppercase tracking-widest px-1">
                                ${group.stopName}
                            </div>
                            <div class="flex flex-col divide-y divide-gray-100 dark:divide-zinc-900 border-t border-b border-gray-100 dark:border-zinc-900">
                                ${renderBusRows(group.routesData)}
                            </div>
                        </div>
                    `;
                }
            });

            appContainer.innerHTML = htmlTemplate || '<div class="text-center py-20 text-gray-400 text-xs">沒有設定任何監控站點，請點選右上角設定。</div>';
        }

        function renderBusRows(routesData) {
            let html = '';
            for (const busItem of routesData) {
                const route = busItem.route;
                const busData = busItem.busData;

                if (busData && busData.length > 0) {
                    const destName = busData[0].dest_tc;

                    const seenTimes = new Set();
                    const uniqueBusData = [];
                    
                    busData.forEach(bus => {
                        if (bus.eta && !seenTimes.has(bus.eta)) {
                            seenTimes.add(bus.eta);
                            uniqueBusData.push(bus);
                        }
                    });

                    const timeList = uniqueBusData.slice(0, 3).map((bus) => {
                        const eta = new Date(bus.eta);
                        const now = new Date();
                        const totalSeconds = Math.floor((eta - now) / 1000);
                        
                        let mins = Math.floor(totalSeconds / 60);
                        let secs = totalSeconds % 60;
                        if (secs < 0) secs = 0;
                        if (mins < 0) mins = 0;

                        let timeText = totalSeconds <= 0 ? "到站" : `${mins}分${secs.toString().padStart(2, '0')}秒`;

                        return `<span class="mono text-xs text-gray-500 dark:text-zinc-400">
                            ${timeText}
                        </span>`;
                    });

                    const timesString = timeList.join('<span class="text-gray-300 dark:text-zinc-800 mx-2">/</span>');

                    html += `
                        <div class="py-3.5 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="mono text-sm font-bold tracking-tight">${route}</span>
                                <span class="text-xs text-gray-400 dark:text-zinc-500">${destName}</span>
                            </div>
                            <div class="flex items-center">
                                ${timesString}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="py-3.5 flex items-center justify-between opacity-30">
                            <span class="mono text-sm font-bold">${route}</span>
                            <span class="text-xs text-gray-400 dark:text-zinc-500">暫無班次</span>
                        </div>
                    `;
                }
            }
            return html;
        }

        // Config Modal Functions
        function openConfigModal() {
            renderConfigList();
            const modal = document.getElementById('config-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfigModal() {
            const modal = document.getElementById('config-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            // 立即重新抓取與渲染
            fetchCounter = 0;
            tick();
        }

        function renderConfigList() {
            const container = document.getElementById('config-list-container');
            let html = '';
            userConfig.forEach((item, index) => {
                html += `
                    <div class="flex items-center justify-between bg-gray-50 dark:bg-zinc-900 px-3 py-2.5 rounded-xl border border-gray-200/60 dark:border-zinc-800 text-xs">
                        <div class="flex flex-col gap-0.5">
                            <div class="flex items-center gap-2">
                                <span class="mono font-bold">${item.route}</span>
                                <span class="text-gray-500">${item.stopName}</span>
                            </div>
                            <span class="mono text-[10px] text-gray-400">${item.stopId}</span>
                        </div>
                        <button onclick="removeConfig(${index})" class="text-red-500 font-semibold px-2 py-1 hover:bg-red-500/10 rounded-lg">刪除</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addCustomConfig() {
            const stopId = document.getElementById('input-stopid').value.trim();
            const stopName = document.getElementById('input-stopname').value.trim();
            const route = document.getElementById('input-route').value.trim().toUpperCase();

            if (!stopId || !stopName || !route) {
                alert('請完整填寫 Stop ID、站點名稱及路線');
                return;
            }

            userConfig.push({
                id: Date.now().toString(),
                stopId,
                stopName,
                route
            });

            localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
            
            // 清空輸入框
            document.getElementById('input-stopid').value = '';
            document.getElementById('input-stopname').value = '';
            document.getElementById('input-route').value = '';

            renderConfigList();
        }

        function removeConfig(index) {
            userConfig.splice(index, 1);
            localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
            renderConfigList();
        }

        function resetDefaultConfig() {
            if (confirm('確定重設為預設監控清單嗎？')) {
                userConfig = [...DEFAULT_CONFIG];
                localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
                renderConfigList();
            }
        }

        let fetchCounter = 0;
        async function tick() {
            if (fetchCounter <= 0 || monitorDataCache === null) {
                fetchCounter = 30; 
                await refreshDataFromAPI();
            }
            document.getElementById('sync-timer').innerText = `${fetchCounter}s`;
            fetchCounter--;
            renderInterface();
        }

        async function init() {
            await tick();
            setInterval(tick, 1000); 
        }

        init();
    </script>
</body>
</html>
