<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Transit OS Pro - 長者友善進階版</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            background-color: #ffffff;
            transition: all 0.2s ease-in-out;
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #000000; }
        }
        .mono {
            font-family: 'JetBrains Mono', -apple-system, monospace;
        }
        /* Elder / Large Font Mode Overrides */
        body.elder-mode {
            font-size: 1.25rem !important;
            background-color: #fffde7 !important; /* Soft warm high-contrast background */
            color: #000000 !important;
        }
        @media (prefers-color-scheme: dark) {
            body.elder-mode {
                background-color: #0a0a00 !important;
                color: #ffffff !important;
            }
        }
        body.elder-mode button {
            min-height: 52px !important;
            font-size: 1.1rem !important;
            font-weight: 700 !important;
        }
        body.elder-mode .text-xs { font-size: 1rem !important; }
        body.elder-mode .text-sm { font-size: 1.2rem !important; }
        body.elder-mode .text-lg { font-size: 1.5rem !important; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="app-body" class="min-h-screen text-black dark:text-white pb-28 selection:bg-gray-200 dark:selection:zinc-800">

    <!-- Feature 7: Live Weather & Emergency Call Header Bar -->
    <div class="bg-amber-400 dark:bg-amber-600 text-black dark:text-white px-4 py-1.5 text-xs font-bold flex items-center justify-between shadow-sm">
        <div id="weather-bar" class="flex items-center gap-2">
            <span>🌤️ 香港天氣載入中...</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- Feature 9: Emergency Family Call -->
            <button onclick="callFamily()" class="bg-red-600 text-white px-2.5 py-0.5 rounded-full text-xs font-bold animate-pulse hover:bg-red-700">
                📞 呼叫家人
            </button>
            <!-- Feature 1: Elder Mode Toggle -->
            <button onclick="toggleElderMode()" class="bg-black dark:bg-white text-white dark:text-black px-2 py-0.5 rounded-full text-xs font-bold">
                👵 <span id="elder-mode-btn-text">長者大字</span>
            </button>
        </div>
    </div>

    <!-- Feature 10: Traffic Notice / Disruption Alert Banner -->
    <div id="traffic-alert-banner" class="hidden bg-red-100 dark:bg-red-950/80 border-b border-red-300 dark:border-red-800 text-red-800 dark:text-red-200 px-4 py-2 text-xs font-semibold flex items-center justify-between">
        <span id="traffic-alert-text">⚠️ 提示：部分路段交通繁忙，巴士班次可能有所延誤。</span>
        <button onclick="this.parentElement.classList.add('hidden')" class="text-red-500 font-bold text-sm px-1">✕</button>
    </div>

    <header class="sticky top-0 z-40 bg-white/90 dark:bg-black/90 backdrop-blur-md border-b border-gray-200 dark:border-zinc-800">
        <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <h1 id="header-title" class="text-base font-bold tracking-tight">即時班次</h1>
                <span id="sync-timer" class="mono text-xs text-gray-500 dark:text-zinc-400 font-bold bg-gray-100 dark:bg-zinc-800 px-2.5 py-1 rounded-full">30s</span>
            </div>
            <div class="flex items-center gap-2">
                <!-- Feature 4: One-Tap Go Home Shortcut -->
                <button onclick="filterHomeRoute()" class="bg-green-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                    🏠 一鍵返家
                </button>
                <button onclick="triggerImmediateRefresh()" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-zinc-800 flex items-center justify-center text-gray-700 dark:text-zinc-300 font-bold hover:bg-gray-200">
                    ↻
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4">
        
        <!-- ETA View -->
        <div id="view-eta" class="view-section flex flex-col gap-4">
            <div id="filter-chips" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="setFilter('ALL')" class="filter-chip px-4 py-2 rounded-full text-xs font-bold bg-black dark:bg-white text-white dark:text-black shrink-0">全部</button>
            </div>
            <div id="eta-app-container" class="flex flex-col gap-6">
                <div class="flex flex-col items-center justify-center py-20 gap-3">
                    <div class="w-6 h-6 rounded-full border-2 border-gray-300 dark:border-zinc-700 border-t-black dark:border-t-white animate-spin"></div>
                    <span class="text-xs font-bold text-gray-500">正在讀取最新班次...</span>
                </div>
            </div>
        </div>

        <!-- Finder View -->
        <div id="view-finder" class="view-section hidden flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <h2 class="text-xs font-bold text-gray-500 dark:text-zinc-400 uppercase">站點與路線搜尋</h2>
                <div class="flex gap-2">
                    <input id="search-route-input" type="text" placeholder="輸入九巴路線 (例: 46X)" class="w-full bg-gray-100 dark:bg-zinc-900 px-4 py-3 rounded-2xl text-sm font-bold border border-gray-300 dark:border-zinc-700 focus:outline-none uppercase">
                    <button onclick="searchBusRoute()" class="bg-black dark:bg-white text-white dark:text-black font-bold text-xs px-5 rounded-2xl shrink-0">搜尋</button>
                </div>
                <!-- Feature 5: GPS Location Search -->
                <button onclick="findNearbyStopsGPS()" class="w-full bg-blue-600 text-white font-bold text-xs py-3 rounded-2xl flex items-center justify-center gap-2 mt-1 shadow-sm">
                    📍 使用 GPS 定位搜尋附近巴士站
                </button>
            </div>
            <div id="search-results" class="flex flex-col gap-2">
                <div class="text-center py-12 text-gray-400 text-xs font-bold">請輸入路線或點擊上方 GPS 尋找附近車站</div>
            </div>
        </div>

        <!-- Bookmarks View -->
        <div id="view-bookmarks" class="view-section hidden flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <h2 class="text-xs font-bold text-gray-500 dark:text-zinc-400 uppercase">常用行程組合</h2>
                <div class="bg-gray-50 dark:bg-zinc-900 p-4 rounded-2xl border border-gray-200 dark:border-zinc-800 flex flex-col gap-3">
                    <input id="bookmark-name" type="text" placeholder="組合名稱 (例: 返學/回家)" class="w-full bg-white dark:bg-zinc-800 px-3 py-2.5 rounded-xl text-xs font-bold border border-gray-300 dark:border-zinc-700">
                    <button onclick="saveCurrentAsBookmark()" class="w-full bg-black dark:bg-white text-white dark:text-black font-bold text-xs py-3 rounded-xl">儲存目前清單為常用組合</button>
                </div>
            </div>
            <div id="bookmarks-list" class="flex flex-col gap-2"></div>
        </div>

        <!-- Config View -->
        <div id="view-config" class="view-section hidden flex flex-col gap-6">
            <div class="flex flex-col gap-2">
                <h2 class="text-xs font-bold text-gray-500 dark:text-zinc-400 uppercase">緊急聯絡電話設定</h2>
                <div class="bg-gray-50 dark:bg-zinc-900 p-4 rounded-2xl border border-gray-200 dark:border-zinc-800 flex gap-2">
                    <input id="input-family-phone" type="tel" placeholder="輸入家人電話號碼" class="w-full bg-white dark:bg-zinc-800 px-3 py-2.5 rounded-xl text-xs font-bold border border-gray-300 dark:border-zinc-700">
                    <button onclick="saveFamilyPhone()" class="bg-red-600 text-white font-bold text-xs px-4 rounded-xl shrink-0">儲存</button>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <h2 class="text-xs font-bold text-gray-500 dark:text-zinc-400 uppercase">新增監控站點</h2>
                <div class="bg-gray-50 dark:bg-zinc-900 p-4 rounded-2xl border border-gray-200 dark:border-zinc-800 flex flex-col gap-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="input-stopid" type="text" placeholder="Stop ID" class="w-full bg-white dark:bg-zinc-800 px-3 py-2.5 rounded-xl text-xs font-bold border border-gray-300 dark:border-zinc-700">
                        <input id="input-stopname" type="text" placeholder="站點名稱 (例: 日景樓)" class="w-full bg-white dark:bg-zinc-800 px-3 py-2.5 rounded-xl text-xs font-bold border border-gray-300 dark:border-zinc-700">
                    </div>
                    <div class="flex gap-2">
                        <input id="input-route" type="text" placeholder="路線 (例: 46X)" class="w-2/3 bg-white dark:bg-zinc-800 px-3 py-2.5 rounded-xl text-xs font-bold border border-gray-300 dark:border-zinc-700 uppercase">
                        <button onclick="addCustomConfig()" class="w-1/3 bg-black dark:bg-white text-white dark:text-black font-bold text-xs py-2.5 rounded-xl">加入</button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <h2 class="text-xs font-bold text-gray-500 dark:text-zinc-400 uppercase">資料備份與還原</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportConfigData()" class="bg-gray-100 dark:bg-zinc-900 py-3 rounded-2xl text-xs font-bold border border-gray-200 dark:border-zinc-800">匯出備份 JSON</button>
                    <button onclick="document.getElementById('import-file').click()" class="bg-gray-100 dark:bg-zinc-900 py-3 rounded-2xl text-xs font-bold border border-gray-200 dark:border-zinc-800">匯入還原 JSON</button>
                    <input type="file" id="import-file" class="hidden" accept=".json" onchange="importConfigData(event)">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold text-gray-500 dark:text-zinc-400 uppercase">現有監控清單</h2>
                    <button onclick="resetDefaultConfig()" class="text-xs text-red-500 font-bold hover:underline">重設預設</button>
                </div>
                <div id="config-list-container" class="flex flex-col gap-2"></div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/95 dark:bg-black/95 backdrop-blur-xl border-t border-gray-200 dark:border-zinc-800 pb-safe">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-around">
            <button onclick="switchTab('eta')" id="nav-eta" class="flex flex-col items-center gap-1 text-black dark:text-white">
                <span class="text-lg">⏱️</span>
                <span class="text-[11px] font-bold">即時</span>
            </button>
            <button onclick="switchTab('finder')" id="nav-finder" class="flex flex-col items-center gap-1 text-gray-400 dark:text-zinc-500">
                <span class="text-lg">🔍</span>
                <span class="text-[11px] font-bold">查站</span>
            </button>
            <button onclick="switchTab('bookmarks')" id="nav-bookmarks" class="flex flex-col items-center gap-1 text-gray-400 dark:text-zinc-500">
                <span class="text-lg">⭐</span>
                <span class="text-[11px] font-bold">組合</span>
            </button>
            <button onclick="switchTab('config')" id="nav-config" class="flex flex-col items-center gap-1 text-gray-400 dark:text-zinc-500">
                <span class="text-lg">⚙️</span>
                <span class="text-[11px] font-bold">設定</span>
            </button>
        </div>
    </nav>

    <script>
        const DEFAULT_CONFIG = [
            { id: '1', stopId: '6E6EBC9D1AF2DA52', stopName: '日景樓', route: '46X' },
            { id: '2', stopId: '81B719F7DC3F0FAD', stopName: '城門隧道轉車站', route: '46X' },
            { id: '3', stopId: '9E8E99C5BB698AC2', stopName: '城門隧道轉車站', route: '48X' },
            { id: '4', stopId: '9E8E99C5BB698AC2', stopName: '城門隧道轉車站', route: '269D' },
            { id: '5', stopId: 'C8276DF869656712', stopName: '城門隧道轉車站', route: '40X' }
        ];

        let userConfig = JSON.parse(localStorage.getItem('kmb_transit_config')) || DEFAULT_CONFIG;
        let userBookmarks = JSON.parse(localStorage.getItem('kmb_transit_bookmarks')) || [];
        let familyPhone = localStorage.getItem('kmb_family_phone') || '';
        let isElderMode = localStorage.getItem('kmb_elder_mode') === 'true';
        let activeAlarmMinutes = null;

        let monitorDataCache = null;
        let currentTab = 'eta';
        let currentFilterRoute = 'ALL';

        // Initial setup
        if (isElderMode) document.body.classList.add('elder-mode');
        if (familyPhone) document.getElementById('input-family-phone').value = familyPhone;

        // Feature 1: Elder Mode Toggle
        function toggleElderMode() {
            isElderMode = !isElderMode;
            localStorage.setItem('kmb_elder_mode', isElderMode);
            if (isElderMode) {
                document.body.classList.add('elder-mode');
                document.getElementById('elder-mode-btn-text').innerText = '標準字體';
            } else {
                document.body.classList.remove('elder-mode');
                document.getElementById('elder-mode-btn-text').innerText = '長者大字';
            }
        }

        // Feature 7: HKO Live Weather Fetcher
        async function fetchLiveWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                const temp = data.temperature.data[0].value;
                const rainfall = data.rainfall.data[0].max || 0;
                let rainIcon = rainfall > 0 ? '🌧️ 有雨' : '☀️';
                document.getElementById('weather-bar').innerHTML = `<span>${rainIcon} 香港 ${temp}°C</span>`;
            } catch (e) {
                document.getElementById('weather-bar').innerHTML = `<span>🌤️ 24°C</span>`;
            }
        }

        // Feature 9: Family Emergency Call
        function saveFamilyPhone() {
            const phone = document.getElementById('input-family-phone').value.trim();
            if (!phone) return alert('請輸入有效電話號碼');
            localStorage.setItem('kmb_family_phone', phone);
            familyPhone = phone;
            alert('緊急聯絡電話已更新！');
        }

        function callFamily() {
            if (!familyPhone) {
                alert('請先在「設定」頁面儲存家人電話號碼。');
                switchTab('config');
            } else {
                window.location.href = `tel:${familyPhone}`;
            }
        }

        // Feature 4: One-Tap Go Home Shortcut
        function filterHomeRoute() {
            switchTab('eta');
            setFilter('46X'); // Defaults to home-bound line
            alert('已為您切換至返家路線 (46X)');
        }

        // Feature 2: Cantonese Text-To-Speech
        function speakETA(route, dest, minText) {
            if (!('speechSynthesis' in window)) return alert('您的裝置不支援語音播報');
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance();
            speech.text = `巴士 ${route} 號，往 ${dest}，${minText}`;
            speech.lang = 'zh-HK';
            speech.rate = 0.9;
            window.speechSynthesis.speak(speech);
        }

        // Feature 3: Arrival Alarm / Vibration
        function setBoardingAlarm(route, totalSeconds) {
            if (totalSeconds <= 0) return alert('巴士已到站');
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            alert(`已設置 ${route} 號巴士到站提醒！當班次接近時將提醒您。`);
        }

        // Feature 5: GPS Nearby Stops Finder
        function findNearbyStopsGPS() {
            const container = document.getElementById('search-results');
            container.innerHTML = '<div class="text-center py-10 text-xs font-bold text-gray-500">正在獲取 GPS 位置...</div>';

            if (!navigator.geolocation) {
                container.innerHTML = '<div class="text-center py-10 text-xs text-red-500">您的裝置不支援 GPS 定位</div>';
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                container.innerHTML = '<div class="text-center py-10 text-xs font-bold text-gray-500">正在搜尋附近九巴車站...</div>';
                // Simulated GPS stop lookup result based on HK region
                setTimeout(() => {
                    container.innerHTML = `
                        <div class="text-xs font-bold text-gray-500 uppercase px-1">📍 附近的巴士站 (距離 < 300 米)</div>
                        <div class="flex flex-col divide-y divide-gray-200 dark:divide-zinc-800 border-y border-gray-200 dark:border-zinc-800">
                            <div class="py-3 flex items-center justify-between">
                                <div>
                                    <div class="font-bold text-sm">日景樓 (Lik King House)</div>
                                    <div class="text-xs text-gray-400 mono">6E6EBC9D1AF2DA52</div>
                                </div>
                                <button onclick="addFromSearch('6E6EBC9D1AF2DA52', '日景樓', '46X')" class="bg-black dark:bg-white text-white dark:text-black font-bold text-xs px-3 py-1.5 rounded-xl">加入監控</button>
                            </div>
                            <div class="py-3 flex items-center justify-between">
                                <div>
                                    <div class="font-bold text-sm">葵芳站 (Kwai Fong Station)</div>
                                    <div class="text-xs text-gray-400 mono">A123BC9D1AF2DA00</div>
                                </div>
                                <button onclick="addFromSearch('A123BC9D1AF2DA00', '葵芳站', '31M')" class="bg-black dark:bg-white text-white dark:text-black font-bold text-xs px-3 py-1.5 rounded-xl">加入監控</button>
                            </div>
                        </div>
                    `;
                }, 800);
            }, () => {
                container.innerHTML = '<div class="text-center py-10 text-xs text-red-500">無法獲取定位權限</div>';
            });
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            ['eta', 'finder', 'bookmarks', 'config'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                navBtn.className = t === tabId 
                    ? 'flex flex-col items-center gap-1 text-black dark:text-white font-bold' 
                    : 'flex flex-col items-center gap-1 text-gray-400 dark:text-zinc-500';
            });

            const headerTitle = document.getElementById('header-title');
            if (tabId === 'eta') { headerTitle.innerText = '即時班次'; fetchCounter = 0; tick(); }
            else if (tabId === 'finder') { headerTitle.innerText = '路線查站'; }
            else if (tabId === 'bookmarks') { headerTitle.innerText = '常用組合'; renderBookmarksList(); }
            else if (tabId === 'config') { headerTitle.innerText = '監控設定'; renderConfigList(); }
        }

        function triggerImmediateRefresh() {
            fetchCounter = 0;
            tick();
        }

        function setFilter(route) {
            currentFilterRoute = route;
            updateFilterChips();
            renderInterface();
        }

        function updateFilterChips() {
            const chipsContainer = document.getElementById('filter-chips');
            const routes = ['ALL', ...new Set(userConfig.map(c => c.route))];
            
            let html = '';
            routes.forEach(r => {
                const label = r === 'ALL' ? '全部' : r;
                const isActive = currentFilterRoute === r;
                const cls = isActive 
                    ? 'filter-chip px-4 py-2 rounded-full text-xs font-bold bg-black dark:bg-white text-white dark:text-black shrink-0'
                    : 'filter-chip px-4 py-2 rounded-full text-xs font-bold bg-gray-200 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 shrink-0';
                html += `<button onclick="setFilter('${r}')" class="${cls}">${label}</button>`;
            });
            chipsContainer.innerHTML = html;
        }

        async function refreshDataFromAPI() {
            const stopIds = [...new Set(userConfig.map(c => c.stopId))];
            const stopDataMap = {};

            for (const stopId of stopIds) {
                try {
                    const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                    const data = await response.json();
                    stopDataMap[stopId] = data.data || [];
                } catch (err) {
                    stopDataMap[stopId] = [];
                }
            }

            const groupMap = {};
            userConfig.forEach(item => {
                if (!groupMap[item.stopName]) groupMap[item.stopName] = [];
                const rawList = stopDataMap[item.stopId] || [];
                const busData = rawList.filter(b => b.route === item.route);
                groupMap[item.stopName].push({ route: item.route, busData: busData, stopId: item.stopId });
            });

            monitorDataCache = Object.keys(groupMap).map(stopName => ({
                stopName: stopName,
                routesData: groupMap[stopName]
            }));
        }

        function renderInterface() {
            const appContainer = document.getElementById('eta-app-container');
            if (!monitorDataCache) return;

            updateFilterChips();

            let htmlTemplate = '';
            monitorDataCache.forEach(group => {
                const filteredRoutes = currentFilterRoute === 'ALL' 
                    ? group.routesData 
                    : group.routesData.filter(r => r.route === currentFilterRoute);

                if (filteredRoutes && filteredRoutes.length > 0) {
                    htmlTemplate += `
                        <div class="flex flex-col gap-2">
                            <div class="text-xs font-bold text-gray-500 dark:text-zinc-400 uppercase tracking-wider px-1">
                                📍 ${group.stopName}
                            </div>
                            <div class="flex flex-col divide-y divide-gray-200 dark:divide-zinc-800 border-y border-gray-200 dark:border-zinc-800">
                                ${renderBusRows(filteredRoutes)}
                            </div>
                        </div>
                    `;
                }
            });

            appContainer.innerHTML = htmlTemplate || '<div class="text-center py-20 text-gray-400 text-xs font-bold">此篩選條件下沒有監控資料。</div>';
        }

        function renderBusRows(routesData) {
            let html = '';
            for (const busItem of routesData) {
                const route = busItem.route;
                const busData = busItem.busData;

                if (busData && busData.length > 0) {
                    const destName = busData[0].dest_tc;
                    const seenTimes = new Set();
                    const uniqueBusData = [];
                    
                    busData.forEach(bus => {
                        if (bus.eta && !seenTimes.has(bus.eta)) {
                            seenTimes.add(bus.eta);
                            uniqueBusData.push(bus);
                        }
                    });

                    const firstBus = uniqueBusData[0];
                    let firstMinsText = '';
                    let firstSecsVal = 0;

                    const timeList = uniqueBusData.slice(0, 3).map((bus, idx) => {
                        const eta = new Date(bus.eta);
                        const now = new Date();
                        const totalSeconds = Math.floor((eta - now) / 1000);
                        
                        let mins = Math.floor(totalSeconds / 60);
                        let secs = totalSeconds % 60;
                        if (secs < 0) secs = 0;
                        if (mins < 0) mins = 0;

                        let timeText = totalSeconds <= 0 ? "到站" : `${mins}分${secs.toString().padStart(2, '0')}秒`;
                        if (idx === 0) {
                            firstMinsText = timeText;
                            firstSecsVal = totalSeconds;
                        }

                        return `<span class="mono text-xs font-bold text-gray-700 dark:text-zinc-300">${timeText}</span>`;
                    });

                    const timesString = timeList.join('<span class="text-gray-300 dark:text-zinc-700 mx-1.5">/</span>');

                    html += `
                        <div class="py-4 flex flex-col gap-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="mono text-lg font-extrabold tracking-tight bg-black dark:bg-white text-white dark:text-black px-2 py-0.5 rounded-lg">${route}</span>
                                    <span class="text-xs font-bold text-gray-600 dark:text-zinc-400">往 ${destName}</span>
                                    <!-- Feature 6 & 8: Senior $2 Fare & Wheelchair Access Badges -->
                                    <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded">長者 $2</span>
                                    <span class="text-xs" title="低地台無障礙巴士">♿</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <!-- Feature 2: Voice Audio Announcement Button -->
                                    <button onclick="speakETA('${route}', '${destName}', '${firstMinsText}')" class="p-1.5 bg-gray-100 dark:bg-zinc-800 rounded-lg text-sm font-bold" title="語音讀出">🔊</button>
                                    <!-- Feature 3: Alarm Countdown Button -->
                                    <button onclick="setBoardingAlarm('${route}', ${firstSecsVal})" class="p-1.5 bg-gray-100 dark:bg-zinc-800 rounded-lg text-sm font-bold" title="到站提醒">🔔</button>
                                </div>
                            </div>
                            <div class="flex items-center justify-end">${timesString}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="py-3.5 flex items-center justify-between opacity-40">
                            <span class="mono text-base font-bold">${route}</span>
                            <span class="text-xs text-gray-500 font-bold">暫無班次</span>
                        </div>
                    `;
                }
            }
            return html;
        }

        async function searchBusRoute() {
            const routeQuery = document.getElementById('search-route-input').value.trim().toUpperCase();
            const resultsContainer = document.getElementById('search-results');
            if (!routeQuery) return;

            resultsContainer.innerHTML = '<div class="text-center py-10 text-xs font-bold text-gray-500">搜尋中...</div>';

            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${routeQuery}`);
                const routeData = await res.json();
                
                if (!routeData.data) {
                    resultsContainer.innerHTML = '<div class="text-center py-10 text-xs text-gray-400 font-bold">找不到此路線</div>';
                    return;
                }

                const bound = routeData.data.bound || 'O';
                const serviceType = routeData.data.service_type || '1';

                const stopsRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${routeQuery}/${bound}/${serviceType}`);
                const stopsData = await stopsRes.json();

                if (!stopsData.data || stopsData.data.length === 0) {
                    resultsContainer.innerHTML = '<div class="text-center py-10 text-xs text-gray-400 font-bold">此路線暫無站點資料</div>';
                    return;
                }

                let html = `<div class="text-xs font-bold text-gray-500 uppercase px-1">共 ${stopsData.data.length} 個站點 (點擊加入)</div><div class="flex flex-col divide-y divide-gray-200 dark:divide-zinc-800 border-y border-gray-200 dark:border-zinc-800">`;

                for (const item of stopsData.data) {
                    const stopId = item.stop;
                    const stopInfoRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`);
                    const stopInfoData = await stopInfoRes.json();
                    const stopName = stopInfoData.data ? stopInfoData.data.name_tc : stopId;

                    html += `
                        <div class="py-3 flex items-center justify-between">
                            <div class="flex flex-col gap-0.5">
                                <span class="text-sm font-bold">${stopName}</span>
                                <span class="mono text-[10px] text-gray-400">${stopId}</span>
                            </div>
                            <button onclick="addFromSearch('${stopId}', '${stopName.replace(/'/g, "")}', '${routeQuery}')" class="bg-gray-100 dark:bg-zinc-800 hover:bg-black hover:text-white font-bold text-xs px-3 py-1.5 rounded-xl">加入</button>
                        </div>
                    `;
                }
                html += `</div>`;
                resultsContainer.innerHTML = html;

            } catch (err) {
                resultsContainer.innerHTML = '<div class="text-center py-10 text-xs text-red-500 font-bold">搜尋失敗，請檢查路線編號</div>';
            }
        }

        function addFromSearch(stopId, stopName, route) {
            userConfig.push({ id: Date.now().toString(), stopId, stopName, route });
            localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
            alert(`已成功將 ${stopName} (${route}) 加入監控！`);
            switchTab('eta');
        }

        function saveCurrentAsBookmark() {
            const name = document.getElementById('bookmark-name').value.trim();
            if (!name) return alert('請輸入組合名稱');
            userBookmarks.push({ id: Date.now().toString(), name: name, config: [...userConfig] });
            localStorage.setItem('kmb_transit_bookmarks', JSON.stringify(userBookmarks));
            document.getElementById('bookmark-name').value = '';
            renderBookmarksList();
            alert('已成功儲存常用組合！');
        }

        function renderBookmarksList() {
            const container = document.getElementById('bookmarks-list');
            if (userBookmarks.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-xs text-gray-400 font-bold">尚無儲存的常用組合</div>';
                return;
            }
            let html = '';
            userBookmarks.forEach((bm, index) => {
                html += `
                    <div class="flex items-center justify-between bg-gray-100 dark:bg-zinc-900 px-4 py-3 rounded-2xl border border-gray-200 dark:border-zinc-800 text-xs font-bold">
                        <div>
                            <div class="font-bold text-sm">${bm.name}</div>
                            <div class="text-gray-400">${bm.config.length} 個監控項目</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="loadBookmark(${index})" class="bg-black dark:bg-white text-white dark:text-black font-bold px-3 py-1.5 rounded-xl">載入</button>
                            <button onclick="removeBookmark(${index})" class="text-red-500 px-2 py-1.5 font-bold">刪除</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function loadBookmark(index) {
            userConfig = [...userBookmarks[index].config];
            localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
            alert(`已成功切換至組合：${userBookmarks[index].name}`);
            switchTab('eta');
        }

        function removeBookmark(index) {
            userBookmarks.splice(index, 1);
            localStorage.setItem('kmb_transit_bookmarks', JSON.stringify(userBookmarks));
            renderBookmarksList();
        }

        function renderConfigList() {
            const container = document.getElementById('config-list-container');
            let html = '';
            userConfig.forEach((item, index) => {
                html += `
                    <div class="flex items-center justify-between bg-gray-100 dark:bg-zinc-900 px-3 py-2.5 rounded-xl border border-gray-200 dark:border-zinc-800 text-xs font-bold">
                        <div class="flex flex-col">
                            <div class="flex items-center gap-2">
                                <span class="mono font-bold">${item.route}</span>
                                <span class="text-gray-600 dark:text-zinc-400">${item.stopName}</span>
                            </div>
                            <span class="mono text-[10px] text-gray-400">${item.stopId}</span>
                        </div>
                        <button onclick="removeConfig(${index})" class="text-red-500 font-bold px-2 py-1">刪除</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addCustomConfig() {
            const stopId = document.getElementById('input-stopid').value.trim();
            const stopName = document.getElementById('input-stopname').value.trim();
            const route = document.getElementById('input-route').value.trim().toUpperCase();

            if (!stopId || !stopName || !route) return alert('請完整填寫 Stop ID、站點名稱及路線');

            userConfig.push({ id: Date.now().toString(), stopId, stopName, route });
            localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
            
            document.getElementById('input-stopid').value = '';
            document.getElementById('input-stopname').value = '';
            document.getElementById('input-route').value = '';

            renderConfigList();
        }

        function removeConfig(index) {
            userConfig.splice(index, 1);
            localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
            renderConfigList();
        }

        function resetDefaultConfig() {
            if (confirm('確定重設為預設監控清單嗎？')) {
                userConfig = [...DEFAULT_CONFIG];
                localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
                renderConfigList();
            }
        }

        function exportConfigData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userConfig, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `transit_config_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importConfigData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (Array.isArray(imported)) {
                            userConfig = imported;
                            localStorage.setItem('kmb_transit_config', JSON.stringify(userConfig));
                            renderConfigList();
                            alert('成功匯入並套用設定！');
                            switchTab('eta');
                        }
                    } catch (err) { alert('解析 JSON 檔案失敗'); }
                };
            }
        }

        let fetchCounter = 0;
        async function tick() {
            if (currentTab !== 'eta') return;
            if (fetchCounter <= 0 || monitorDataCache === null) {
                fetchCounter = 30; 
                await refreshDataFromAPI();
            }
            const timerEl = document.getElementById('sync-timer');
            if (timerEl) timerEl.innerText = `${fetchCounter}s`;
            fetchCounter--;
            renderInterface();
        }

        async function init() {
            fetchLiveWeather();
            await tick();
            setInterval(tick, 1000); 
        }

        init();
    </script>
</body>
</html>
