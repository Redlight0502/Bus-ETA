<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KMB Transit</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            background-color: #f2f2f7;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000000;
            }
        }
        .ios-card {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        @media (prefers-color-scheme: dark) {
            .ios-card {
                background-color: rgba(28, 28, 30, 0.75);
            }
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen text-black dark:text-white pb-12 selection:bg-blue-500 selection:text-white">

    <!-- iOS Navigation Bar -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-white/70 dark:bg-black/70 border-b border-black/5 dark:border-white/10 pt-safe">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div>
                <div class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Live Tracker</div>
                <h1 class="text-xl font-bold tracking-tight">KMB Transit</h1>
            </div>
            <div class="flex items-center gap-2">
                <div id="sync-badge" class="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-200/80 dark:bg-zinc-800 text-gray-600 dark:text-gray-300 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                    <span id="sync-timer" class="font-mono text-[11px]">30s</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app" class="max-w-md mx-auto px-4 pt-4 flex flex-col gap-6">
        <!-- Initial Loading State -->
        <div class="flex flex-col items-center justify-center py-32 gap-3">
            <div class="w-8 h-8 rounded-full border-2 border-gray-300 dark:border-zinc-700 border-t-blue-500 animate-spin"></div>
            <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">更新即時班次中...</span>
        </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        let monitorDataCache = null;

        // 從 KMB API 獲取資料
        async function fetchBusETA(stopId, route) {
            try {
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const data = await response.json();
                return data.data.filter(item => item.route === route);
            } catch (error) {
                console.error(`讀取站點 ${stopId} 路線 ${route} 失敗:`, error);
                return [];
            }
        }

        // 核心資料更新（每 30 秒默默在背景抓取一次）
        async function refreshDataFromAPI() {
            const stationGroups = [
                {
                    stopName: '日景樓',
                    subName: 'YAT KING HOUSE',
                    routes: [{ stopId: '6E6EBC9D1AF2DA52', route: '46X' }]
                },
                {
                    stopName: '城門隧道轉車站',
                    subName: 'SHING MUN TUNNEL',
                    routes: [
                        { stopId: '81B719F7DC3F0FAD', route: '46X' },
                        { stopId: '9E8E99C5BB698AC2', route: '48X' },
                        { stopId: '9E8E99C5BB698AC2', route: '269D' },
                        { stopId: 'C8276DF869656712', route: '40X' }
                    ]
                }
            ];

            const newData = [];
            for (const group of stationGroups) {
                const groupBuses = [];
                for (const r of group.routes) {
                    const busData = await fetchBusETA(r.stopId, r.route);
                    groupBuses.push({ route: r.route, busData });
                }
                newData.push({ stopName: group.stopName, subName: group.subName, routesData: groupBuses });
            }
            monitorDataCache = newData;
        }

        // 核心大腦：尋車、時間線過濾、動態排序與界面渲染
        function renderInterface() {
            const appContainer = document.getElementById('app');
            if (!monitorDataCache) return;

            // ================== 🧠 智慧對接與尋車 ==================
            let myCarArrivalAtShingMunTime = null;
            let shingMunMy46XEtaString = null; 

            const yatKingGroup = monitorDataCache.find(g => g.stopName.includes('日景樓'));
            const shingMunGroup = monitorDataCache.find(g => g.stopName.includes('城門隧道'));

            if (yatKingGroup && shingMunGroup) {
                const yk46xRoute = yatKingGroup.routesData.find(r => r.route === '46X');
                const sm46xRoute = shingMunGroup.routesData.find(r => r.route === '46X');

                if (yk46xRoute && yk46xRoute.busData[0] && sm46xRoute && sm46xRoute.busData) {
                    const ykFirstBusEta = new Date(yk46xRoute.busData[0].eta).getTime();
                    
                    // 精準定位：日景樓開出時間 + 13 分鐘合理車程
                    const estimatedShingMunTime = ykFirstBusEta + (13 * 60 * 1000); 

                    let minDiff = Infinity;
                    let targetBus = null;

                    sm46xRoute.busData.forEach(bus => {
                        if (bus.eta) {
                            const busTime = new Date(bus.eta).getTime();
                            const diff = Math.abs(busTime - estimatedShingMunTime);
                            // 必須比日景樓到站時間晚，才是你正坐在上面的那一班 46X
                            if (diff < minDiff && busTime > ykFirstBusEta) {
                                minDiff = diff;
                                targetBus = bus;
                            }
                        }
                    });

                    if (targetBus) {
                        myCarArrivalAtShingMunTime = new Date(targetBus.eta);
                        shingMunMy46XEtaString = targetBus.eta; 
                    } else {
                        myCarArrivalAtShingMunTime = new Date(estimatedShingMunTime);
                    }
                }
            }

            // 🏎️ 轉乘爭霸賽：過濾並鎖定未來有效的班次
            let validTransferBuses = [];
            const myTargetTime = myCarArrivalAtShingMunTime ? myCarArrivalAtShingMunTime.getTime() : 0;

            if (shingMunGroup && myTargetTime > 0) {
                ['48X', '269D', '40X'].forEach(targetRoute => {
                    const rData = shingMunGroup.routesData.find(r => r.route === targetRoute);
                    if (rData && rData.busData) {
                        rData.busData.forEach(bus => {
                            if (bus.eta) {
                                const busTime = new Date(bus.eta).getTime();
                                // 轉乘車的時間必須大於（或等於減去30秒步行誤差）你下車的時間
                                if (busTime >= myTargetTime - 30000) {
                                    validTransferBuses.push({
                                        route: targetRoute,
                                        etaString: bus.eta,
                                        time: busTime
                                    });
                                }
                            }
                        });
                    }
                });
            }

            // 全局轉乘班次排序：找出趕得上且最快的前兩名
            validTransferBuses.sort((a, b) => a.time - b.time);
            let globalRedBus = validTransferBuses[0] || null;
            let globalYellowBus = validTransferBuses[1] || null;
            // ============================================================

            let htmlTemplate = '';

            // 1. 渲染 日景樓 區塊
            if (yatKingGroup) {
                htmlTemplate += `
                    <div class="flex flex-col gap-1.5">
                        <div class="px-1 flex items-baseline justify-between">
                            <h2 class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">${yatKingGroup.stopName}</h2>
                            <span class="text-[10px] text-gray-400 dark:text-gray-600 font-mono">${yatKingGroup.subName}</span>
                        </div>
                        <div class="ios-card rounded-2xl border border-black/5 dark:border-white/10 shadow-sm overflow-hidden divide-y divide-black/5 dark:divide-white/10">
                            ${renderBusRows(yatKingGroup.routesData, '日景樓', shingMunMy46XEtaString, globalRedBus, globalYellowBus)}
                        </div>
                    </div>
                `;
            }

            // 2. 渲染 城門隧道轉車站 區塊
            if (shingMunGroup) {
                const sm46xData = shingMunGroup.routesData.filter(r => r.route === '46X');
                const transferRoutesData = shingMunGroup.routesData.filter(r => ['48X', '269D', '40X'].includes(r.route));

                // 轉乘線 (48X, 269D, 40X) 複製新陣列並依據「首個趕得上的有效班次時間」進行動態排序
                const sortedTransferRoutes = [...transferRoutesData].sort((routeA, routeB) => {
                    const validBusA = routeA.busData.find(b => b.eta && new Date(b.eta).getTime() >= myTargetTime - 30000);
                    const validBusB = routeB.busData.find(b => b.eta && new Date(b.eta).getTime() >= myTargetTime - 30000);

                    const timeA = validBusA ? new Date(validBusA.eta).getTime() : Infinity;
                    const timeB = validBusB ? new Date(validBusB.eta).getTime() : Infinity;
                    
                    return timeA - timeB; 
                });

                // 合併 46X 與 排序後的轉乘線
                const combinedShingMunRoutes = [...sm46xData, ...sortedTransferRoutes];

                htmlTemplate += `
                    <div class="flex flex-col gap-1.5 pt-2">
                        <div class="px-1 flex items-baseline justify-between">
                            <h2 class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">${shingMunGroup.stopName}</h2>
                            <span class="text-[10px] text-gray-400 dark:text-gray-600 font-mono">${shingMunGroup.subName}</span>
                        </div>
                        <div class="ios-card rounded-2xl border border-black/5 dark:border-white/10 shadow-sm overflow-hidden divide-y divide-black/5 dark:divide-white/10">
                            ${renderBusRows(combinedShingMunRoutes, '城門隧道', shingMunMy46XEtaString, globalRedBus, globalYellowBus)}
                        </div>
                    </div>
                `;
            }

            appContainer.innerHTML = htmlTemplate;
        }

        // 產生路線 HTML 卡片的輔助函式
        function renderBusRows(routesData, stationType, shingMunMy46XEtaString, globalRedBus, globalYellowBus) {
            let html = '';
            for (const busItem of routesData) {
                const route = busItem.route;
                const busData = busItem.busData;

                if (busData && busData.length > 0) {
                    const destName = busData[0].dest_tc;

                    const seenTimes = new Set();
                    const uniqueBusData = [];
                    
                    busData.forEach(bus => {
                        if (bus.eta && !seenTimes.has(bus.eta)) {
                            seenTimes.add(bus.eta);
                            uniqueBusData.push(bus);
                        }
                    });

                    // 過濾完重複後，才切取前 3 個有效班次
                    const timeList = uniqueBusData.slice(0, 3).map((bus, index) => {
                        const eta = new Date(bus.eta);
                        const now = new Date();
                        const totalSeconds = Math.floor((eta - now) / 1000);
                        
                        let timeText = totalSeconds <= 0 ? "即將到達" : `${Math.floor(totalSeconds / 60)} 分`;
                        if (totalSeconds > 0 && totalSeconds < 60) {
                            timeText = `${totalSeconds} 秒`;
                        }

                        let isRedBlink = false;
                        let isYellowBlink = false;

                        if (stationType === '日景樓') {
                            if (index === 0) isRedBlink = true; 
                        } else if (stationType === '城門隧道') {
                            if (route === '46X') {
                                if (shingMunMy46XEtaString && bus.eta === shingMunMy46XEtaString) {
                                    isRedBlink = true; 
                                }
                            } else {
                                if (globalRedBus && globalRedBus.route === route && bus.eta === globalRedBus.etaString) {
                                    isRedBlink = true;
                                } else if (globalYellowBus && globalYellowBus.route === route && bus.eta === globalYellowBus.etaString) {
                                    isYellowBlink = true;
                                }
                            }
                        }

                        if (isRedBlink) {
                            return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500 text-white shadow-sm animate-pulse-subtle">
                                ${timeText}
                            </span>`;
                        } else if (isYellowBlink) {
                            return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500 text-white shadow-sm animate-pulse-subtle">
                                ${timeText}
                            </span>`;
                        } else {
                            return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-gray-300">
                                ${timeText}
                            </span>`;
                        }
                    });

                    const timesString = timeList.join('');

                    html += `
                        <div class="px-4 py-3.5 flex items-center justify-between transition-colors hover:bg-black/[0.02] dark:hover:bg-white/[0.02]">
                            <div class="flex items-center gap-3">
                                <div class="flex items-center justify-center min-w-[48px] h-9 px-2 rounded-xl bg-red-600 text-white font-bold text-sm tracking-wide shadow-sm">
                                    ${route}
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-xs text-gray-400 dark:text-gray-500 font-medium">往目的地</span>
                                    <span class="text-sm font-semibold tracking-tight">${destName}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1.5 font-mono">
                                ${timesString}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="px-4 py-3.5 flex items-center justify-between opacity-40">
                            <div class="flex items-center gap-3">
                                <div class="flex items-center justify-center min-w-[48px] h-9 px-2 rounded-xl bg-gray-400 text-white font-bold text-sm">
                                    ${route}
                                </div>
                                <span class="text-sm font-medium text-gray-500">暫無班次資料</span>
                            </div>
                        </div>
                    `;
                }
            }
            return html;
        }

        // 控制器：每秒更新倒數分秒，每 30 秒強制抓取一次最新的網路資料
        let fetchCounter = 0;
        async function tick() {
            if (fetchCounter <= 0 || monitorDataCache === null) {
                fetchCounter = 30; 
                await refreshDataFromAPI();
            }
            document.getElementById('sync-timer').innerText = `${fetchCounter}s`;
            fetchCounter--;
            renderInterface();
        }

        async function init() {
            await tick();
            setInterval(tick, 1000); 
        }

        init();
    </script>
</body>
</html>
