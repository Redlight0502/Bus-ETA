<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KMB Neural Transit Matrix — Live ETA & Transfer Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Inter', 'JetBrains Mono', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Cyberpunk / Tech Glowing Effects & Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-panel-active {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 25px -5px rgba(56, 189, 248, 0.2);
        }

        .tech-glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.35);
            border-color: rgba(239, 68, 68, 0.6) !important;
        }

        .tech-glow-yellow {
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.35);
            border-color: rgba(234, 179, 8, 0.6) !important;
        }

        /* Scanline Background Overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }

        @keyframes cyber-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }
        .animate-cyber-pulse {
            animation: cyber-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar {
            animation: radar-sweep 4s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col items-center selection:bg-cyan-500 selection:text-black">

    <!-- Ambient Background Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-cyan-600/15 rounded-full blur-[120px]"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-blue-600/15 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-indigo-600/15 rounded-full blur-[120px]"></div>
        <div class="absolute inset-0 scanlines opacity-30 pointer-events-none"></div>
    </div>

    <!-- Main Container -->
    <div class="relative z-10 w-full max-w-xl px-4 py-6 flex flex-col gap-6 min-h-screen">

        <!-- Header Dashboard Bar -->
        <header class="glass-panel rounded-2xl p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="relative flex items-center justify-center w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                        </svg>
                        <div class="absolute inset-0 rounded-xl border border-cyan-400/50 animate-ping opacity-20"></div>
                    </div>
                    <div>
                        <div class="text-xs font-mono uppercase tracking-widest text-cyan-400/80 font-semibold">Neural Transit Matrix v4.6</div>
                        <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
                            KMB Live Intercept
                            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </h1>
                    </div>
                </div>
                
                <!-- System Status / Sync Indicator -->
                <div class="flex flex-col items-end">
                    <div id="sync-badge" class="px-2.5 py-1 rounded-full text-[10px] font-mono font-bold bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 flex items-center gap-1.5">
                        <svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="sync-timer">SYNC: 30s</span>
                    </div>
                    <span id="clock-display" class="text-[11px] font-mono text-slate-400 mt-1">--:--:--</span>
                </div>
            </div>

            <!-- Mini Telemetry Strip -->
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800/80 text-center font-mono">
                <div class="bg-slate-900/60 rounded-lg p-1.5 border border-slate-800">
                    <div class="text-[10px] text-slate-500">ORIGIN</div>
                    <div class="text-xs font-bold text-cyan-400">Yat King</div>
                </div>
                <div class="bg-slate-900/60 rounded-lg p-1.5 border border-slate-800">
                    <div class="text-[10px] text-slate-500">NODE</div>
                    <div class="text-xs font-bold text-purple-400">Shing Mun</div>
                </div>
                <div class="bg-slate-900/60 rounded-lg p-1.5 border border-slate-800">
                    <div class="text-[10px] text-slate-500">TARGET</div>
                    <div class="text-xs font-bold text-emerald-400">48X/269D/40X</div>
                </div>
            </div>
        </header>

        <!-- Dynamic Container for Stations / Routes -->
        <main id="app" class="flex flex-col gap-4 flex-grow pb-8">
            <!-- Rendered dynamically by JavaScript -->
            <div class="flex flex-col items-center justify-center py-20 gap-4">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 rounded-full border-2 border-cyan-500/20 border-t-cyan-400 animate-spin"></div>
                    <div class="absolute inset-3 rounded-full border-2 border-purple-500/20 border-b-purple-400 animate-radar"></div>
                </div>
                <div class="text-xs font-mono text-cyan-400 animate-pulse tracking-widest">ESTABLISHING NEURAL LINK...</div>
            </div>
        </main>

        <!-- Footer Info -->
        <footer class="text-center text-[10px] font-mono text-slate-600 pb-2">
            DATA SOURCE: KMB OPEN API &bull; OPTIMIZED FOR HONG KONG COMMUTERS
        </footer>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let monitorDataCache = null;

        // 從 KMB API 獲取資料
        async function fetchBusETA(stopId, route) {
            try {
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const data = await response.json();
                return data.data.filter(item => item.route === route);
            } catch (error) {
                console.error(`讀取站點 ${stopId} 路線 ${route} 失敗:`, error);
                return [];
            }
        }

        // 核心資料更新（每 30 秒默默在背景抓取一次）
        async function refreshDataFromAPI() {
            const stationGroups = [
                {
                    stopName: '日景樓 (YAT KING HOUSE)',
                    routes: [{ stopId: '6E6EBC9D1AF2DA52', route: '46X' }]
                },
                {
                    stopName: '城門隧道轉車站 (SHING MUN TUNNEL)',
                    routes: [
                        { stopId: '81B719F7DC3F0FAD', route: '46X' },
                        { stopId: '9E8E99C5BB698AC2', route: '48X' },
                        { stopId: '9E8E99C5BB698AC2', route: '269D' },
                        { stopId: 'C8276DF869656712', route: '40X' }
                    ]
                }
            ];

            const newData = [];
            for (const group of stationGroups) {
                const groupBuses = [];
                for (const r of group.routes) {
                    const busData = await fetchBusETA(r.stopId, r.route);
                    groupBuses.push({ route: r.route, busData });
                }
                newData.push({ stopName: group.stopName, routesData: groupBuses });
            }
            monitorDataCache = newData;
        }

        // 核心大腦：尋車、時間線過濾、動態排序與界面渲染
        function renderInterface() {
            const appContainer = document.getElementById('app');
            if (!monitorDataCache) return;

            // Update real-time clock
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toTimeString().split(' ')[0];

            // ================== 🧠 智慧對接與尋車 ==================
            let myCarArrivalAtShingMunTime = null;
            let shingMunMy46XEtaString = null; 

            const yatKingGroup = monitorDataCache.find(g => g.stopName.includes('日景樓'));
            const shingMunGroup = monitorDataCache.find(g => g.stopName.includes('城門隧道'));

            if (yatKingGroup && shingMunGroup) {
                const yk46xRoute = yatKingGroup.routesData.find(r => r.route === '46X');
                const sm46xRoute = shingMunGroup.routesData.find(r => r.route === '46X');

                if (yk46xRoute && yk46xRoute.busData[0] && sm46xRoute && sm46xRoute.busData) {
                    const ykFirstBusEta = new Date(yk46xRoute.busData[0].eta).getTime();
                    
                    // 精準定位：日景樓開出時間 + 13 分鐘合理車程
                    const estimatedShingMunTime = ykFirstBusEta + (13 * 60 * 1000); 

                    let minDiff = Infinity;
                    let targetBus = null;

                    sm46xRoute.busData.forEach(bus => {
                        if (bus.eta) {
                            const busTime = new Date(bus.eta).getTime();
                            const diff = Math.abs(busTime - estimatedShingMunTime);
                            // 必須比日景樓到站時間晚，才是你正坐在上面的那一班 46X
                            if (diff < minDiff && busTime > ykFirstBusEta) {
                                minDiff = diff;
                                targetBus = bus;
                            }
                        }
                    });

                    if (targetBus) {
                        myCarArrivalAtShingMunTime = new Date(targetBus.eta);
                        shingMunMy46XEtaString = targetBus.eta; 
                    } else {
                        myCarArrivalAtShingMunTime = new Date(estimatedShingMunTime);
                    }
                }
            }

            // 🏎️ 轉乘爭霸賽：過濾並鎖定未來有效的班次
            let validTransferBuses = [];
            const myTargetTime = myCarArrivalAtShingMunTime ? myCarArrivalAtShingMunTime.getTime() : 0;

            if (shingMunGroup && myTargetTime > 0) {
                ['48X', '269D', '40X'].forEach(targetRoute => {
                    const rData = shingMunGroup.routesData.find(r => r.route === targetRoute);
                    if (rData && rData.busData) {
                        rData.busData.forEach(bus => {
                            if (bus.eta) {
                                const busTime = new Date(bus.eta).getTime();
                                // 轉乘車的時間必須大於（或等於減去30秒步行誤差）你下車的時間
                                if (busTime >= myTargetTime - 30000) {
                                    validTransferBuses.push({
                                        route: targetRoute,
                                        etaString: bus.eta,
                                        time: busTime
                                    });
                                }
                            }
                        });
                    }
                });
            }

            // 全局轉乘班次排序：找出趕得上且最快的前兩名
            validTransferBuses.sort((a, b) => a.time - b.time);
            let globalRedBus = validTransferBuses[0] || null;
            let globalYellowBus = validTransferBuses[1] || null;
            // ============================================================

            let htmlTemplate = '';

            // 1. 渲染 日景樓 區塊
            if (yatKingGroup) {
                htmlTemplate += `
                    <div class="flex items-center gap-2 px-1 pt-2">
                        <div class="w-2 h-2 rounded-full bg-cyan-400"></div>
                        <h2 class="text-xs font-mono font-bold tracking-wider text-cyan-400 uppercase">${yatKingGroup.stopName}</h2>
                    </div>
                `;
                htmlTemplate += renderBusRows(yatKingGroup.routesData, '日景樓', shingMunMy46XEtaString, globalRedBus, globalYellowBus);
            }

            // 2. 渲染 城門隧道轉車站 區塊
            if (shingMunGroup) {
                htmlTemplate += `
                    <div class="flex items-center gap-2 px-1 pt-4">
                        <div class="w-2 h-2 rounded-full bg-purple-400"></div>
                        <h2 class="text-xs font-mono font-bold tracking-wider text-purple-400 uppercase">${shingMunGroup.stopName}</h2>
                    </div>
                `;
                
                const sm46xData = shingMunGroup.routesData.filter(r => r.route === '46X');
                const transferRoutesData = shingMunGroup.routesData.filter(r => ['48X', '269D', '40X'].includes(r.route));

                // 46X 永遠固定在城隧置頂第一行
                htmlTemplate += renderBusRows(sm46xData, '城門隧道', shingMunMy46XEtaString, globalRedBus, globalYellowBus);

                // 轉乘線 (48X, 269D, 40X) 複製新陣列並依據「首個趕得上的有效班次時間」進行動態排序
                const sortedTransferRoutes = [...transferRoutesData].sort((routeA, routeB) => {
                    const validBusA = routeA.busData.find(b => b.eta && new Date(b.eta).getTime() >= myTargetTime - 30000);
                    const validBusB = routeB.busData.find(b => b.eta && new Date(b.eta).getTime() >= myTargetTime - 30000);

                    const timeA = validBusA ? new Date(validBusA.eta).getTime() : Infinity;
                    const timeB = validBusB ? new Date(validBusB.eta).getTime() : Infinity;
                    
                    return timeA - timeB; 
                });

                htmlTemplate += renderBusRows(sortedTransferRoutes, '城門隧道', shingMunMy46XEtaString, globalRedBus, globalYellowBus);
            }

            appContainer.innerHTML = htmlTemplate;
        }

        // 產生路線 HTML 卡片的輔助函式
        function renderBusRows(routesData, stationType, shingMunMy46XEtaString, globalRedBus, globalYellowBus) {
            let html = '';
            for (const busItem of routesData) {
                const route = busItem.route;
                const busData = busItem.busData;

                if (busData && busData.length > 0) {
                    const destName = busData[0].dest_tc;

                    const seenTimes = new Set();
                    const uniqueBusData = [];
                    
                    busData.forEach(bus => {
                        if (bus.eta && !seenTimes.has(bus.eta)) {
                            seenTimes.add(bus.eta);
                            uniqueBusData.push(bus);
                        }
                    });

                    // 過濾完重複後，才切取前 3 個有效班次
                    let hasHighlightedItem = false;
                    const timeList = uniqueBusData.slice(0, 3).map((bus, index) => {
                        const eta = new Date(bus.eta);
                        const now = new Date();
                        const totalSeconds = Math.floor((eta - now) / 1000);
                        
                        let timeText = totalSeconds <= 0 ? "ARRIVED" : `${Math.floor(totalSeconds / 60)}M ${(totalSeconds % 60).toString().padStart(2, '0')}S`;

                        let isRedBlink = false;
                        let isYellowBlink = false;

                        if (stationType === '日景樓') {
                            if (index === 0) isRedBlink = true; 
                        } else if (stationType === '城門隧道') {
                            if (route === '46X') {
                                if (shingMunMy46XEtaString && bus.eta === shingMunMy46XEtaString) {
                                    isRedBlink = true; 
                                }
                            } else {
                                if (globalRedBus && globalRedBus.route === route && bus.eta === globalRedBus.etaString) {
                                    isRedBlink = true;
                                } else if (globalYellowBus && globalYellowBus.route === route && bus.eta === globalYellowBus.etaString) {
                                    isYellowBlink = true;
                                }
                            }
                        }

                        if (isRedBlink || isYellowBlink) {
                            hasHighlightedItem = true;
                        }

                        if (isRedBlink) {
                            return `<div class="px-2.5 py-1 rounded-lg bg-red-500/20 border border-red-500/50 text-red-400 font-mono font-extrabold text-xs tracking-wider animate-cyber-pulse flex items-center gap-1 shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                                <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span>
                                ${timeText}
                            </div>`;
                        } else if (isYellowBlink) {
                            return `<div class="px-2.5 py-1 rounded-lg bg-yellow-500/20 border border-yellow-500/50 text-yellow-300 font-mono font-extrabold text-xs tracking-wider animate-cyber-pulse flex items-center gap-1 shadow-[0_0_15px_rgba(234,179,8,0.3)]">
                                <span class="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-ping"></span>
                                ${timeText}
                            </div>`;
                        } else {
                            return `<div class="px-2 py-1 rounded-lg bg-slate-900/50 border border-slate-800 text-slate-400 font-mono font-medium text-xs">
                                ${timeText}
                            </div>`;
                        }
                    });

                    const timesString = timeList.join('');
                    const panelClass = hasHighlightedItem ? 'glass-panel-active' : 'glass-panel';

                    html += `
                        <div class="${panelClass} rounded-2xl p-4 transition-all duration-300 hover:border-cyan-500/40">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    <div class="flex items-center justify-center min-w-[52px] h-10 px-2.5 rounded-xl bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 font-mono font-extrabold text-base tracking-wider shadow-inner">
                                        ${route}
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-xs font-mono text-slate-400">DESTINATION</span>
                                        <span class="text-sm font-bold text-white tracking-wide">往 ${destName}</span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                                    ${timesString}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="glass-panel rounded-2xl p-4 opacity-40">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="flex items-center justify-center min-w-[52px] h-10 px-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-500 font-mono font-bold text-base">
                                        ${route}
                                    </div>
                                    <span class="text-sm text-slate-500 font-mono">NO ACTIVE TELEMETRY</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
            return html;
        }

        // 控制器：每秒更新倒數分秒，每 30 秒強制抓取一次最新的網路資料
        let fetchCounter = 0;
        async function tick() {
            if (fetchCounter <= 0 || monitorDataCache === null) {
                fetchCounter = 30; 
                document.getElementById('sync-badge').classList.add('animate-pulse');
                await refreshDataFromAPI();
                document.getElementById('sync-badge').classList.remove('animate-pulse');
            }
            document.getElementById('sync-timer').innerText = `SYNC: ${fetchCounter}s`;
            fetchCounter--;
            renderInterface();
        }

        async function init() {
            await tick();
            setInterval(tick, 1000); 
        }

        init();
    </script>
</body>
</html>
